packages:
  - apps/*
  - packages/*
overrides:
  "@digitalbazaar/http-client>undici": 6.29.1
  "@types/node": 24.19.0
  esbuild: 0.28.1
  jose: 6.2.12
  nanoid: 3.3.18
  postcss: 8.5.26
  source-map-js: 1.2.2
  zod: 4.6.6
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Released security fixes for GHSA-mrhx-c7xc-m3w5 and GHSA-xjj6-f33q-929c.
  - "zod@4.6.6"
  - "undici@6.29.1"
  - "undici@7.30.1"
  # Selected SMTP release includes current security fixes; verify TLS/protocol behavior before release.
  - "nodemailer@10.0.14"
  # Patch fixes GHSA-68fv-2mgg-jv7q; verify both runtime builds before release.
  - "source-map-js@1.2.2"
  # CredTrail is a co-author on @longsightgroup/lti-tool, so we can safely consume coordinated releases immediately.
  - "@longsightgroup/lti-tool"
  # Wrangler updates unblock local Cloudflare compatibility checks and are verified before commit.
  - "@cloudflare/vite-plugin"
  - "@cloudflare/workers-types"
  - "wrangler"
  - "vite"
  - "postcss"
  # Nano ID security patches are audited and may need to bypass the release-age quarantine.
  - "nanoid"
  # Rolldown builds the Node self-host Docker artifact; verify the bundled runtime before commit.
  - "rolldown"
  - "@oxc-project/types"
  - "@rolldown/*"
  - "workerd"
  - "miniflare"
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
blockExoticSubdeps: true
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

packages:
  - apps/*
  - packages/*
overrides:
  "@digitalbazaar/http-client>undici": 6.28.0
  "@types/node": 24.13.2
  esbuild: 0.28.1
  jose: 6.2.3
  nanoid: 3.3.18
  postcss: 8.5.26
  zod: 4.4.3
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # CredTrail is a co-author on @longsightgroup/lti-tool, so we can safely consume coordinated releases immediately.
  - "@longsightgroup/lti-tool"
  # Wrangler updates unblock local Cloudflare compatibility checks and are verified before commit.
  - "@cloudflare/workers-types"
  - "wrangler"
  - "vite"
  - "postcss"
  # Nano ID security patches are audited and may need to bypass the release-age quarantine.
  - "nanoid"
  # Rolldown builds the Node self-host Docker artifact; verify the bundled runtime before commit.
  - "rolldown"
  - "@oxc-project/types"
  - "@rolldown/*"
  - "workerd"
  - "miniflare"
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
blockExoticSubdeps: true
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

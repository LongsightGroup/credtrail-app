packages:
  - apps/*
  - packages/*
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # CredTrail is a co-author on @longsightgroup/lti-tool, so we can safely consume coordinated releases immediately.
  - "@longsightgroup/lti-tool"
  # Wrangler updates unblock local Cloudflare compatibility checks and are verified before commit.
  - "@cloudflare/workers-types"
  - "wrangler"
  # Rolldown builds the Node self-host Docker artifact; verify the bundled runtime before commit.
  - "rolldown"
  - "@oxc-project/types"
  - "@rolldown/binding-android-arm64"
  - "@rolldown/binding-darwin-arm64"
  - "@rolldown/binding-darwin-x64"
  - "@rolldown/binding-freebsd-x64"
  - "@rolldown/binding-linux-arm-gnueabihf"
  - "@rolldown/binding-linux-arm64-gnu"
  - "@rolldown/binding-linux-arm64-musl"
  - "@rolldown/binding-linux-ppc64-gnu"
  - "@rolldown/binding-linux-s390x-gnu"
  - "@rolldown/binding-linux-x64-gnu"
  - "@rolldown/binding-linux-x64-musl"
  - "@rolldown/binding-openharmony-arm64"
  - "@rolldown/binding-wasm32-wasi"
  - "@rolldown/binding-win32-arm64-msvc"
  - "@rolldown/binding-win32-x64-msvc"
  - "workerd"
  - "miniflare"
  - "@cloudflare/workerd-darwin-64"
  - "@cloudflare/workerd-darwin-arm64"
  - "@cloudflare/workerd-linux-64"
  - "@cloudflare/workerd-linux-arm64"
  - "@cloudflare/workerd-windows-64"
blockExoticSubdeps: true
ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

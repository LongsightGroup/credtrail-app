name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: credtrail
          POSTGRES_PASSWORD: credtrail
          POSTGRES_DB: credtrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credtrail -d credtrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: OpenAPI Snapshot Sync
        run: pnpm check:ob3-openapi

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: pnpm db:migrate:postgres

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: pnpm test

      - name: Script Tests
        run: pnpm test:scripts

      - name: Build Docker image
        run: docker build -f Dockerfile -t credtrail-ci:${{ github.sha }} .

      - name: Run Docker smoke stack
        run: |
          set -euo pipefail
          docker network create credtrail-ci-net

          cleanup() {
            for container in credtrail-ci-app credtrail-ci-worker credtrail-ci-postgres credtrail-ci-s3; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                docker logs "$container" || true
                docker rm -f "$container" >/dev/null 2>&1 || true
              fi
            done
            docker network rm credtrail-ci-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          DATABASE_URL="postgresql://credtrail:credtrail@credtrail-ci-postgres:5432/credtrail"
          JOB_PROCESSOR_TOKEN="$(openssl rand -hex 32)"

          docker run -d \
            --name credtrail-ci-postgres \
            --network credtrail-ci-net \
            -e POSTGRES_USER=credtrail \
            -e POSTGRES_PASSWORD=credtrail \
            -e POSTGRES_DB=credtrail \
            postgres:17-alpine

          docker run --rm --network credtrail-ci-net postgres:17-alpine sh -ceu '
            for _ in $(seq 1 30); do
              pg_isready -h credtrail-ci-postgres -U credtrail -d credtrail && exit 0
              sleep 1
            done
            exit 1
          '

          docker run --rm \
            --network credtrail-ci-net \
            -e DATABASE_URL="$DATABASE_URL" \
            credtrail-ci:${{ github.sha }} \
            node node_modules/@credtrail/db/scripts/migrate-postgres.mjs

          docker build -f Dockerfile.gofakes3 -t credtrail-ci-s3 .
          docker run -d \
            --name credtrail-ci-s3 \
            --network credtrail-ci-net \
            credtrail-ci-s3

          # Exercise the packaged S3 SDK over the same network as the app.
          docker run --rm -i \
            --network credtrail-ci-net \
            credtrail-ci:${{ github.sha }} \
            node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { setTimeout } from "node:timers/promises";
          import {
            S3Client, HeadBucketCommand, PutObjectCommand,
            GetObjectCommand, HeadObjectCommand, DeleteObjectCommand,
          } from "@aws-sdk/client-s3";

          const client = new S3Client({
            endpoint: "http://credtrail-ci-s3:9000",
            region: "us-east-1",
            forcePathStyle: true,
            credentials: { accessKeyId: "ci-storage", secretAccessKey: "ci-storage" },
          });
          try {
            for (let attempt = 1; attempt <= 30; attempt++) {
              try {
                await client.send(new HeadBucketCommand({ Bucket: "credtrail-badges" }));
                break;
              } catch (error) {
                if (attempt === 30) throw error;
                await setTimeout(1000);
              }
            }
            const object = { Bucket: "credtrail-badges", Key: "ci/storage-smoke.json" };
            const body = JSON.stringify({ message: "Credential storage smoke test" });
            await client.send(new PutObjectCommand({ ...object, Body: body, IfNoneMatch: "*" }));
            await assert.rejects(
              client.send(new PutObjectCommand({ ...object, Body: "overwrite", IfNoneMatch: "*" })),
              (error) => error.$metadata?.httpStatusCode === 412,
            );
            const result = await client.send(new GetObjectCommand(object));
            assert.equal(await result.Body.transformToString(), body);
            const metadata = await client.send(new HeadObjectCommand(object));
            assert.equal(metadata.ContentLength, Buffer.byteLength(body));
            await client.send(new DeleteObjectCommand(object));
            await assert.rejects(
              client.send(new HeadObjectCommand(object)),
              (error) => error.$metadata?.httpStatusCode === 404,
            );
            console.log("S3 write, immutable conflict, read, metadata, and delete checks passed.");
          } finally {
            client.destroy();
          }
          JS

          docker run -d \
            --name credtrail-ci-app \
            --network credtrail-ci-net \
            -p 8787:8787 \
            -e APP_ENV=test \
            -e PLATFORM_DOMAIN=localhost \
            -e PUBLIC_APP_ORIGIN=http://localhost:8787 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e STORAGE_BACKEND=s3 \
            -e S3_ENDPOINT=http://credtrail-ci-s3:9000 \
            -e S3_BUCKET=credtrail-badges \
            -e S3_REGION=us-east-1 \
            -e S3_FORCE_PATH_STYLE=true \
            -e AWS_ACCESS_KEY_ID=ci-storage \
            -e AWS_SECRET_ACCESS_KEY=ci-storage \
            -e JOB_PROCESSOR_TOKEN="$JOB_PROCESSOR_TOKEN" \
            credtrail-ci:${{ github.sha }}

          discovery_status=""
          deps_status=""

          for attempt in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Running}}' credtrail-ci-app 2>/dev/null || true)" != "true" ]; then
              echo "App container exited before becoming ready."
              docker logs credtrail-ci-app || true
              exit 1
            fi

            discovery_status="$(curl \
              --connect-timeout 2 \
              --max-time 5 \
              -sS \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8787/ims/ob/v3p0/discovery || true)"
            deps_status="$(curl \
              --connect-timeout 2 \
              --max-time 5 \
              -sS \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8787/healthz/dependencies || true)"

            if [ "$discovery_status" = "200" ] && [ "$deps_status" = "200" ]; then
              echo "App endpoints returned 200 on attempt $attempt."
              break
            fi

            if [ "$attempt" = "40" ]; then
              echo "Endpoint checks failed (discovery=$discovery_status dependencies=$deps_status)."
              exit 1
            fi

            sleep 1
          done

          docker run --rm \
            --network credtrail-ci-net \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:17-alpine sh -ceu "
              # Exercise a supported, storage-independent queue path without seeded tenant data.
              psql \"\$DATABASE_URL\" -v ON_ERROR_STOP=1 -c \"
                INSERT INTO job_queue_messages (
                  id,
                  tenant_id,
                  job_type,
                  payload_json,
                  idempotency_key,
                  available_at,
                  status,
                  created_at,
                  updated_at
                )
                VALUES (
                  'job-ci-smoke-1',
                  'ci-tenant',
                  'process_badge_rule_lifecycle',
                  json_build_object(
                    'scheduledFor',
                    '2026-08-17T00:00:00.000Z'
                  )::text,
                  'ci-smoke-lifecycle-1',
                  CURRENT_TIMESTAMP::text,
                  'pending',
                  CURRENT_TIMESTAMP::text,
                  CURRENT_TIMESTAMP::text
                );
              \"
            "

          docker run -d \
            --name credtrail-ci-worker \
            --network credtrail-ci-net \
            -e APP_ENV=test \
            -e PLATFORM_DOMAIN=localhost \
            -e PUBLIC_APP_ORIGIN=http://localhost:8787 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e STORAGE_BACKEND=s3 \
            -e S3_ENDPOINT=http://credtrail-ci-s3:9000 \
            -e S3_BUCKET=credtrail-badges \
            -e S3_REGION=us-east-1 \
            -e S3_FORCE_PATH_STYLE=true \
            -e AWS_ACCESS_KEY_ID=ci-storage \
            -e AWS_SECRET_ACCESS_KEY=ci-storage \
            -e JOB_PROCESSOR_TOKEN="$JOB_PROCESSOR_TOKEN" \
            -e JOB_POLL_INTERVAL_MS=250 \
            credtrail-ci:${{ github.sha }} \
            node dist/node-runtime/node-worker-runtime.js

          queue_status=""
          for attempt in $(seq 1 40); do
            queue_status="$(docker run --rm \
              --network credtrail-ci-net \
              -e DATABASE_URL="$DATABASE_URL" \
              postgres:17-alpine sh -ceu "
                psql \"\$DATABASE_URL\" -tAc \
                  \"SELECT status FROM job_queue_messages WHERE id = 'job-ci-smoke-1';\"
              " | tr -d '[:space:]' || true)"

            if [ "$queue_status" = "completed" ]; then
              echo "Queue worker completed smoke job on attempt $attempt."
              break
            fi

            if [ "$attempt" = "40" ]; then
              echo "Queue smoke job did not complete (last status: ${queue_status:-none})."
              exit 1
            fi

            sleep 1
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: credtrail
          POSTGRES_PASSWORD: credtrail
          POSTGRES_DB: credtrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credtrail -d credtrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure local dev env
        run: |
          cp wrangler.local.jsonc.example wrangler.local.jsonc
          cp .dev.vars.local.example .dev.vars.local

      - name: Migrate and seed
        env:
          DATABASE_URL: postgres://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: |
          pnpm db:migrate:postgres
          pnpm dev:seed

      - name: Build page assets
        run: pnpm build:page-assets

      - name: Run Playwright e2e
        env:
          CREDTRAIL_DEV_BASE_URL: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          mkdir -p output

          pnpm exec wrangler dev \
            --config wrangler.local.jsonc \
            --env-file .dev.vars.local \
            --port 8787 \
            > output/wrangler-ci.log 2>&1 &
          wrangler_pid="$!"

          cleanup() {
            kill "$wrangler_pid" >/dev/null 2>&1 || true
            wait "$wrangler_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          status=""
          for attempt in $(seq 1 60); do
            if ! kill -0 "$wrangler_pid" >/dev/null 2>&1; then
              echo "Wrangler exited before becoming ready."
              cat output/wrangler-ci.log
              exit 1
            fi

            status="$(curl \
              --connect-timeout 2 \
              --max-time 5 \
              -sS \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8787/healthz/dependencies || true)"

            if [ "$status" = "200" ]; then
              echo "Wrangler dependencies returned 200 on attempt $attempt."
              break
            fi

            if [ "$attempt" = "60" ]; then
              echo "Wrangler did not become ready (last dependencies status: ${status:-none})."
              cat output/wrangler-ci.log
              exit 1
            fi

            sleep 1
          done

          curl \
            --connect-timeout 2 \
            --max-time 15 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 1 \
            -fsS \
            -X POST \
            http://127.0.0.1:8787/v1/dev/storage/seed-trusted-demo-credential

          pnpm test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            output/playwright-report
            test-results
            output/wrangler-ci.log

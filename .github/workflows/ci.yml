name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: credtrail
          POSTGRES_PASSWORD: credtrail
          POSTGRES_DB: credtrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credtrail -d credtrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: OpenAPI Snapshot Sync
        run: pnpm check:ob3-openapi

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: pnpm db:migrate:postgres

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: pnpm test

      - name: Script Tests
        run: pnpm test:scripts

      - name: Build Docker image
        run: docker build -f Dockerfile -t credtrail-ci:${{ github.sha }} .

      - name: Install production smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production self-host TLS, SMTP and issuance contracts
        run: node scripts/selfhost-production-smoke.mjs --image credtrail-ci:${{ github.sha }}

      - name: Verify Compose with external and local Postgres
        run: node scripts/selfhost-compose-smoke.mjs --image credtrail-ci:${{ github.sha }}

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: credtrail
          POSTGRES_PASSWORD: credtrail
          POSTGRES_DB: credtrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credtrail -d credtrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure local dev env
        run: |
          cp wrangler.local.jsonc.example wrangler.local.jsonc
          cp .dev.vars.local.example .dev.vars.local
          processor_token="$(openssl rand -hex 32)"
          echo "JOB_PROCESSOR_TOKEN=$processor_token" >> .dev.vars.local

      - name: Migrate and seed
        env:
          DATABASE_URL: postgres://credtrail:credtrail@127.0.0.1:5432/credtrail
        run: |
          pnpm db:migrate:postgres
          pnpm dev:seed

      - name: Build page assets
        run: pnpm build:page-assets

      - name: Run Playwright e2e
        env:
          CREDTRAIL_DEV_BASE_URL: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          mkdir -p output

          pnpm exec wrangler dev \
            --config wrangler.local.jsonc \
            --env-file .dev.vars.local \
            --port 8787 \
            > output/wrangler-ci.log 2>&1 &
          wrangler_pid="$!"

          cleanup() {
            kill "$wrangler_pid" >/dev/null 2>&1 || true
            wait "$wrangler_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          status=""
          for attempt in $(seq 1 60); do
            if ! kill -0 "$wrangler_pid" >/dev/null 2>&1; then
              echo "Wrangler exited before becoming ready."
              cat output/wrangler-ci.log
              exit 1
            fi

            status="$(curl \
              --connect-timeout 2 \
              --max-time 5 \
              -sS \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8787/healthz/dependencies || true)"

            if [ "$status" = "200" ]; then
              echo "Wrangler dependencies returned 200 on attempt $attempt."
              break
            fi

            if [ "$attempt" = "60" ]; then
              echo "Wrangler did not become ready (last dependencies status: ${status:-none})."
              cat output/wrangler-ci.log
              exit 1
            fi

            sleep 1
          done

          curl \
            --connect-timeout 2 \
            --max-time 15 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 1 \
            -fsS \
            -X POST \
            http://127.0.0.1:8787/v1/dev/storage/seed-trusted-demo-credential

          pnpm test:e2e

      - name: Upload Playwright artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            output/playwright-report
            test-results
            output/wrangler-ci.log

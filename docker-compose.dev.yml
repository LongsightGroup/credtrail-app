services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credtrail
      POSTGRES_USER: credtrail
      POSTGRES_PASSWORD: credtrail
    ports:
      - "5432:5432"
    volumes:
      - credtrail-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credtrail -d credtrail"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  credtrail-dev-postgres:
